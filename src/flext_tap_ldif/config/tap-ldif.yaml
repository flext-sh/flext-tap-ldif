TapLdif:
  streams:
    - name: ldif_entries
      primary_keys: ["dn"]
      schema:
        type: object
        properties:
          dn:
            type: string
          attributes:
            type: object
          object_class:
            type: array
            items:
              type: string
          change_type:
            type: string
          source_file:
            type: string
          line_number:
            type: integer
          entry_size:
            type: integer
